<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f4f5f8"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Мои тетради</title><link rel="stylesheet" href="style.css"></head><body><div id="app"><aside id="sidebar"><header><h1>Мои тетради</h1><button id="newBook">+ Тетрадь</button></header><div id="books"></div><p class="hint">Все записи сохраняются на этом устройстве.</p></aside><main><div id="topbar"><button id="toggleSidebar" aria-label="Показать тетради">☰</button><strong id="bookTitle">Тетрадь</strong><div class="spacer"></div><button id="addPage">+ Страница</button><button id="exportPdf">PDF</button></div><div id="toolbar"><button class="tool active" data-tool="pen">✎ Ручка</button><button class="tool" data-tool="marker">▰ Маркер</button><button class="tool" data-tool="eraser">⌫ Ластик</button><label>Цвет <input id="color" type="color" value="#222222"></label><label>Толщина <input id="width" type="range" min="1" max="25" value="3"></label><button id="undo" aria-label="Отменить штрих">↶</button><button id="redo" aria-label="Повторить штрих">↷</button><button id="clear">Очистить</button><select id="paper" aria-label="Разлиновка бумаги"><option value="grid">Клетка</option><option value="lines">Линейка</option><option value="blank">Чистый</option></select></div><div id="workspace"><div id="page"><canvas id="canvas" aria-label="Страница для рисования Apple Pencil или пальцем"></canvas></div></div><div id="bottom"><button id="prev" aria-label="Предыдущая страница">←</button><span id="pageCount">1 / 1</span><button id="next" aria-label="Следующая страница">→</button></div></main></div><script src="app.js"></script></body></html>
